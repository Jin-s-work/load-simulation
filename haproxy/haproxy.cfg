# Phase 03: L7 로드밸런서.
#
# nginx 가 아니라 HAProxy 를 쓰는 이유:
#   오픈소스 nginx 에는 액티브 헬스체크(interval/timeout/threshold)가 없다. 상용판 기능이다.
#   HAProxy 는 액티브·패시브 둘 다 기본이고 Prometheus 지표를 내장으로 내보낸다.
#
# 실험용 값은 전부 환경변수로 뺐다. 한 번에 하나만 바꾸기 위해서다.

global
    log stdout format raw local0 info
    # 프로세스 전체 동시 커넥션 상한. 실험 (a) 에서 이걸 낮춰 고갈시킨다.
    maxconn "${LB_MAXCONN}"
    # nbthread 를 명시하지 않으면 코어 수만큼 쓴다. 앱(단일 스레드)과 대비되는 지점이다.
    nbthread 2

defaults
    mode http                      # L7. 요청 단위로 분배한다. L4 였다면 커넥션 단위였다.
    log global
    option httplog
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    timeout queue   10s            # maxconn 초과 시 큐에서 기다릴 최대 시간
    timeout http-keep-alive 60s
    # 실패한 요청을 다른 백엔드로 재시도. L7 이라 가능한 일이다(L4 는 못 한다).
    retries 2
    option redispatch

# ---------------------------------------------------------------------------
# 통계 / 지표
# ---------------------------------------------------------------------------
frontend stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    no log

# ---------------------------------------------------------------------------
# 서비스 프론트엔드
# ---------------------------------------------------------------------------
frontend fe_app
    # backlog: accept 큐 길이. 실험 (c) 에서 이걸 낮춰 SYN 드롭을 만든다.
    bind *:8000 backlog "${LB_BACKLOG}"
    maxconn "${LB_FE_MAXCONN}"
    default_backend be_app

backend be_app
    # roundrobin | leastconn | source  (source = nginx 의 ip_hash 에 해당)
    balance "${LB_ALGO}"

    # 액티브 헬스체크: LB 가 2초마다 먼저 물어본다.
    #   inter = 확인 주기, fall = 연속 N회 실패 시 제거, rise = 연속 N회 성공 시 복귀
    #   감지까지 걸리는 최대 시간 = inter x fall
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200

    # 업스트림 커넥션 재사용. 실험 (b) 에서 never 로 바꿔 포트 고갈을 만든다.
    #   safe   = 재사용하되 멱등하지 않은 첫 요청은 새 커넥션으로
    #   never  = 매 요청 새 TCP 커넥션 (= keep-alive 끔)
    http-reuse "${LB_HTTP_REUSE}"

    # 백엔드당 유지할 유휴 커넥션 수
    default-server pool-max-conn "${LB_POOL_MAX_CONN}" check inter "${LB_CHECK_INTER}" fall "${LB_CHECK_FALL}" rise "${LB_CHECK_RISE}" maxconn "${LB_SRV_MAXCONN}"

    # Phase 06: 6대를 상시 정의한다.
    # app4~6 은 compose profile "six" 로만 뜨므로, 3대 구성에서는 헬스체크가 실패해
    # 자동으로 DOWN 처리된다. LB 입장에서 "안 뜬 서버"와 "죽은 서버"는 같다.
    # (init-addr last,libc,none = 기동 시 DNS 가 안 풀려도 HAProxy 가 죽지 않게 한다.
    #  이게 없으면 app4 컨테이너가 없을 때 HAProxy 자체가 기동 실패한다.)
    server app1 app1:3000
    server app2 app2:3000
    server app3 app3:3000
    server app4 app4:3000 init-addr last,libc,none
    server app5 app5:3000 init-addr last,libc,none
    server app6 app6:3000 init-addr last,libc,none

    # 어느 인스턴스가 처리했는지 응답 헤더로 확인할 수 있게 한다.
    http-response set-header X-Served-By %[srv_name]
