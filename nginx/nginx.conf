# Phase 02-B: TLS termination 을 프록시가 맡는 구성.
#
# 핵심 대비:
#   - 앱(Node)은 JS 스레드가 하나뿐이라 TLS 계산이 요청 처리 예산을 직접 갉아먹는다.
#   - nginx 는 워커 프로세스를 여러 개 띄워 여러 코어를 쓴다. 이게 오프로딩의 근거다.

worker_processes auto;   # 코어 수만큼. Node 와 대비되는 지점이라 일부러 auto 로 둔다.

events {
    worker_connections 4096;
}

http {
    access_log off;      # 앱에서 요청 로그를 끈 것과 같은 이유. 로깅을 재려는 게 아니다.
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;

    upstream app_upstream {
        server app:3000;
        # 뒤쪽(nginx -> 앱) 커넥션을 재사용한다. 이게 없으면 요청마다 새 TCP 를 뚫어
        # 프록시가 오히려 부하를 만든다. 리버스 프록시의 핵심 이점 중 하나.
        keepalive 128;
    }

    # ---- 대조군: 평문 통과 -------------------------------------------------
    # TLS 없이 프록시만 거친다. 여기서 나온 비용이 "프록시 홉 그 자체의 값"이다.
    # 이걸 빼야 TLS 비용만 남는다.
    server {
        listen 8080 backlog=4096;

        location / {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    # ---- TLS 종료 ----------------------------------------------------------
    server {
        listen 8443 ssl backlog=4096;
        http2 off;   # HTTP/2 는 별개의 변수다. 한 번에 하나씩 바꾸기 위해 끈다.

        # CERT_KIND 를 바꾸려면 이 두 줄을 교체하고 nginx 를 재기동한다.
        ssl_certificate     /certs/ecdsa-cert.pem;
        ssl_certificate_key /certs/ecdsa-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # 세션 재개를 끈다. 핸드쉐이크 비용을 "있는 그대로" 재기 위해서다.
        # 켜면 재개가 섞여서 전체 핸드쉐이크 비용이 희석된다.
        # (재개를 켠 상태도 별도 실험으로 잴 수 있다.)
        ssl_session_cache off;
        ssl_session_tickets off;

        location / {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
