# Phase 01 - 의도적으로 취약한 기준선
#
# 없는 것(의도적): 캐시, 메시지 큐, 로드밸런서, 리버스 프록시, HTTPS, 앱 클러스터링.
# 리소스 상한을 명시적으로 박아 둔다. 이게 없으면 다음 주에 같은 숫자가 안 나온다.
#
# colima VM: 6 CPU / 8GB 기준으로 배분했다.
#   app 2.0 + postgres 2.0 + k6 1.5 + 관측 0.5 = 6.0

name: loadtest-sim

x-app-base: &app-base
  build: ./app
  sysctls:
    # (c) accept 큐의 커널 상한. Node 는 스레드가 하나라 바쁠 때 accept 가 늦어진다.
    - net.core.somaxconn=${APP_SOMAXCONN:-4096}
  # Phase 04: 자원 한계를 명확히 못 박는다.
  # cpus=1.0 -> Node 의 JS 스레드 하나가 쓸 수 있는 최대와 같아 "벽"이 정확해진다.
  # mem=512m -> OOM 재현이 현실적인 시간 안에 가능해진다.
  ports: []
  volumes:
    - ./certs:/certs:ro
  depends_on:
    postgres:
      condition: service_healthy
  cpus: ${APP_CPUS:-1.0}
  mem_limit: ${APP_MEM:-512m}
  restart: unless-stopped

x-app-env: &app-env
  PORT: 3000
  # Phase 06: 앱이 DB 에 직접 붙을지, PgBouncer 를 거칠지를 여기서 가른다.
  #   직결   DB_HOST=postgres  DB_PORT=5432
  #   프록시 DB_HOST=pgbouncer DB_PORT=6432
  # 앱 코드는 아무것도 모른다 — 커넥션 문자열만 바뀐다. 그게 프록시의 장점이다.
  DATABASE_URL: postgres://lts:lts@${DB_HOST:-postgres}:${DB_PORT:-5432}/lts
  TLS_MODE: ${TLS_MODE:-off}
  TLS_MIN_VERSION: ${TLS_MIN_VERSION:-TLSv1.2}
  TLS_MAX_VERSION: ${TLS_MAX_VERSION:-TLSv1.3}
  APP_BACKLOG: ${APP_BACKLOG:-511}
  # ── Phase 04: 부하 주입 ──────────────────────────────────────────────
  CPU_BURN_MS: ${CPU_BURN_MS:-0}          # 요청당 동기 CPU 연산 (ms)
  CPU_BURN_ASYNC: ${CPU_BURN_ASYNC:-0}    # 1 이면 스레드풀에서 (루프를 막지 않음)
  ALLOC_KB: ${ALLOC_KB:-0}                # 요청당 할당할 객체 크기 (KB)
  ALLOC_HOLD: ${ALLOC_HOLD:-200}          # 붙잡아 둘 객체 개수
  # ── Phase 04: 보호 장치 ──────────────────────────────────────────────
  MAX_CONCURRENT: ${MAX_CONCURRENT:-0}        # bulkhead
  SHED_INFLIGHT: ${SHED_INFLIGHT:-0}          # 큐 길이 기반 load shedding
  SHED_LOOP_LAG_MS: ${SHED_LOOP_LAG_MS:-0}    # 루프 지연 기반 load shedding
  REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-0}
  # ── Phase 04: 동시성 ─────────────────────────────────────────────────
  CLUSTER_WORKERS: ${CLUSTER_WORKERS:-1}
  METRICS_PORT: 3001
  UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-4}
  # ── Phase 05: 커넥션 풀 ──────────────────────────────────────────────
  # ★ 앱 인스턴스 하나 기준이다. DB 가 받는 건 (앱 대수 × PG_POOL_MAX).
  #   앱 3대 × 40 = 120 이면 Postgres 기본 max_connections=100 을 넘긴다.
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  PG_ACQUIRE_TIMEOUT_MS: ${PG_ACQUIRE_TIMEOUT_MS:-0}   # 0 = 무한 대기
  PG_IDLE_TIMEOUT_MS: ${PG_IDLE_TIMEOUT_MS:-10000}
  PG_MAX_LIFETIME_SEC: ${PG_MAX_LIFETIME_SEC:-0}       # 0 = 무제한
  # ── Phase 05: 서버측 타임아웃 (Postgres 기본값은 셋 다 0=무제한) ────
  PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-0}
  PG_LOCK_TIMEOUT_MS: ${PG_LOCK_TIMEOUT_MS:-0}
  PG_IDLE_TX_TIMEOUT_MS: ${PG_IDLE_TX_TIMEOUT_MS:-0}
  # ── Phase 05: DB 부하 주입 / 개선 경로 ───────────────────────────────
  TX_HOLD_MS: ${TX_HOLD_MS:-0}          # (e) 락을 쥔 채 머무는 시간
  SLOW_QUERY: ${SLOW_QUERY:-0}          # (f) 인덱스 없는 조회를 트랜잭션에 추가
  TX_OPTIMIZED: ${TX_OPTIMIZED:-0}      # 개선: 트랜잭션 왕복 5회 -> 2회
  # ── Phase 07: 캐시 ──────────────────────────────────────────────────
  CACHE_MODE: ${CACHE_MODE:-off}             # off | local | redis | tiered
  CACHE_TTL_MS: ${CACHE_TTL_MS:-3000}
  CACHE_TTL_JITTER: ${CACHE_TTL_JITTER:-0}   # 0 = 지터 없음 = stampede 조건
  SINGLEFLIGHT: ${SINGLEFLIGHT:-0}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: lts-postgres
    # 설정을 일절 건드리지 않는다. max_connections=100, shared_buffers=128MB 기본값 그대로.
    # postgres.conf 튜닝은 Phase 02 의 주제다.
    environment:
      POSTGRES_USER: lts
      POSTGRES_PASSWORD: lts
      POSTGRES_DB: lts
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lts -d lts"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 2.0
    mem_limit: 2g

  # ---------------------------------------------------------------------------
  # Phase 03: 앱 3대. Phase 01~02 의 단일 `app` 서비스를 대체한다.
  # (Phase 02 구성을 그대로 돌리려면 `git checkout phase-02`)
  #
  # cpus 는 1.2 로 둔다. Phase 01 에서 관측한 단일 스레드 상한이 1.15 코어라 사실상
  # 구속하지 않으면서, 한 대가 폭주해 다른 대를 굶기는 것만 막는다.
  # ---------------------------------------------------------------------------
  app1:
    <<: *app-base
    container_name: lts-app1
    ports:
      - "3000:3000"     # Phase 04: LB 를 거치지 않고 직접 재기 위해 노출
      # 클러스터 워커별 지표 포트 (3011~3014). 워커가 적으면 남는 포트는 안 열린다.
      - "3011:3011"
      - "3012:3012"
      - "3013:3013"
      - "3014:3014"
    environment:
      <<: *app-env
      INSTANCE_ID: app1
      SLOW_MS: ${APP1_SLOW_MS:-0}
      DRAIN_WAIT_MS: ${APP1_DRAIN_WAIT_MS:-0}

  app2:
    <<: *app-base
    container_name: lts-app2
    environment:
      <<: *app-env
      INSTANCE_ID: app2
      SLOW_MS: ${APP2_SLOW_MS:-0}
      DRAIN_WAIT_MS: ${APP2_DRAIN_WAIT_MS:-0}

  app3:
    <<: *app-base
    container_name: lts-app3
    environment:
      <<: *app-env
      INSTANCE_ID: app3
      SLOW_MS: ${APP3_SLOW_MS:-0}
      DRAIN_WAIT_MS: ${APP3_DRAIN_WAIT_MS:-0}

  # ---------------------------------------------------------------------------
  # Phase 06: 앱 4~6호기.
  #
  # profiles 를 붙여 기본 구성에서는 뜨지 않게 한다. `--profile six` 를 줄 때만 뜬다.
  # 이렇게 하지 않으면 Phase 01~05 를 재현할 때 앱이 6대 뜨면서 커넥션 수가 달라진다.
  #
  # HAProxy 는 6대를 상시 정의한다. 안 뜬 인스턴스는 헬스체크로 DOWN 처리되어
  # 트래픽을 받지 않는다 — LB 입장에서는 "죽은 서버"와 구분할 필요가 없다.
  # ---------------------------------------------------------------------------
  app4:
    <<: *app-base
    container_name: lts-app4
    profiles: ["six"]
    environment:
      <<: *app-env
      INSTANCE_ID: app4

  app5:
    <<: *app-base
    container_name: lts-app5
    profiles: ["six"]
    environment:
      <<: *app-env
      INSTANCE_ID: app5

  app6:
    <<: *app-base
    container_name: lts-app6
    profiles: ["six"]
    environment:
      <<: *app-env
      INSTANCE_ID: app6

  # ---------------------------------------------------------------------------
  # Phase 06 의 주인공. 앱과 DB 사이의 커넥션 풀러.
  #
  # 하는 일은 하나다 — 앱이 여는 많은 커넥션을 DB 쪽 적은 커넥션으로 접는다.
  #   앱 6대 × 풀 10 = 60 개를 받아서  ->  DB 에는 DEFAULT_POOL_SIZE 만큼만 연다.
  #
  # ★ PgBouncer 는 단일 스레드다. Phase 01(앱 단일 스레드), Phase 04(CPU 1개)와
  #   같은 교훈이 세 번째 계층에서 반복된다. cpus 를 낮추면 여기가 병목이 된다.
  # ---------------------------------------------------------------------------
  # Phase 07: 공유 캐시.
  #
  # 로컬 캐시와의 결정적 차이는 **앱 N대일 때의 miss 횟수**다.
  # 로컬은 같은 키에 N번 miss 하지만 Redis 는 한 번이다.
  #
  # maxmemory 를 걸어 두 이유: 상한이 없으면 컨테이너 mem_limit 에 먼저 부딪혀
  # OOM kill 이 난다. Redis 가 스스로 축출하게 두는 편이 관찰 가능하다.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: lts-redis
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-128mb}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: 256m
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: lts-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: lts
      DB_PASSWORD: lts
      DB_NAME: lts
      # 이 이미지의 기본 listen_port 는 5432 다. 그대로 두면 "postgres 에 붙었는지
      # pgbouncer 에 붙었는지" 를 포트로 구분할 수 없어 디버깅이 어려워진다.
      # PgBouncer 관례 포트인 6432 로 명시한다.
      LISTEN_PORT: 6432
      # session | transaction | statement
      #   session     : 클라이언트 연결이 끊길 때까지 서버 커넥션을 붙잡는다 (접힘 거의 없음)
      #   transaction : COMMIT/ROLLBACK 때 반납한다 (실무 표준)
      #   statement   : 쿼리마다 반납. 멀티문 트랜잭션 자체가 불가 -> 우리 라우트는 못 쓴다
      POOL_MODE: ${PGB_POOL_MODE:-transaction}
      # DB 쪽으로 실제로 여는 커넥션 수. 이 값이 "접힘 비율"을 정한다.
      DEFAULT_POOL_SIZE: ${PGB_DEFAULT_POOL_SIZE:-20}
      # 앱에서 받아줄 커넥션 수. 이게 작으면 PgBouncer 가 먼저 거절한다.
      MAX_CLIENT_CONN: ${PGB_MAX_CLIENT_CONN:-1000}
      # 풀이 꽉 찼을 때 추가로 열 수 있는 여유분. 0 이면 엄격히 DEFAULT_POOL_SIZE 만.
      RESERVE_POOL_SIZE: ${PGB_RESERVE_POOL_SIZE:-0}
      AUTH_TYPE: scram-sha-256
      # 관리 콘솔(SHOW POOLS)에 붙을 수 있어야 계측이 된다.
      ADMIN_USERS: lts
      STATS_USERS: lts
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=lts psql -h 127.0.0.1 -p 6432 -U lts -d pgbouncer -tAc 'SHOW VERSION' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    cpus: ${PGB_CPUS:-1.0}
    mem_limit: 256m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Phase 03 의 주인공. L7 로드밸런서.
  # 실험용 값은 전부 환경변수. 한 번에 하나만 바꾼다.
  # ---------------------------------------------------------------------------
  haproxy:
    image: haproxy:3.0-alpine
    container_name: lts-haproxy
    environment:
      LB_ALGO: ${LB_ALGO:-roundrobin}          # roundrobin | leastconn | source
      LB_MAXCONN: ${LB_MAXCONN:-20000}         # (a) 프로세스 전체 커넥션 상한
      LB_FE_MAXCONN: ${LB_FE_MAXCONN:-20000}   # (a) 프론트엔드 상한
      LB_SRV_MAXCONN: ${LB_SRV_MAXCONN:-2000}  # 백엔드 1대당 동시 요청 상한
      LB_BACKLOG: ${LB_BACKLOG:-4096}          # (c) accept 큐 길이
      LB_HTTP_REUSE: ${LB_HTTP_REUSE:-safe}    # (b) safe | never
      LB_POOL_MAX_CONN: ${LB_POOL_MAX_CONN:-100}
      LB_CHECK_INTER: ${LB_CHECK_INTER:-2s}    # 헬스체크 주기
      LB_CHECK_FALL: ${LB_CHECK_FALL:-3}       # 연속 N회 실패 -> 제거
      LB_CHECK_RISE: ${LB_CHECK_RISE:-2}       # 연속 N회 성공 -> 복귀
    ports:
      - "8000:8000"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    sysctls:
      # (b) ephemeral 포트 범위. 좁히면 포트 고갈이 빨리 재현된다.
      - net.ipv4.ip_local_port_range=${LB_PORT_RANGE:-32768 60999}
      # (c) accept 큐의 커널 쪽 상한. bind backlog 와 둘 중 작은 값이 적용된다.
      - net.core.somaxconn=${LB_SOMAXCONN:-4096}
    ulimits:
      # (a) 파일 디스크립터 상한. 커넥션 하나가 fd 하나다.
      nofile:
        soft: ${LB_NOFILE:-65535}
        hard: ${LB_NOFILE:-65535}
    depends_on:
      - app1
      - app2
      - app3
    cpus: 1.5
    mem_limit: 512m

  # Phase 02-B: 앞단에서 TLS 를 종료하는 리버스 프록시.
  # 8080 = 평문 통과 (프록시 홉 비용만 재기 위한 대조군)
  # 8443 = TLS 종료 후 뒤쪽 앱에는 평문으로 전달
  # Phase 02 유물. 기본 기동에서 제외한다 (Phase 03 은 HAProxy 가 주인공).
  nginx:
    image: nginx:1.27-alpine
    container_name: lts-nginx
    profiles: ["phase02"]
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    depends_on:
      - app1
    cpus: 1.5
    mem_limit: 256m


  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: lts-pg-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://lts:lts@postgres:5432/lts?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.2
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.1.0
    # Phase 07: 상한을 명시한다. 없으면 카디널리티 폭발 시 VM 메모리를 다 먹고
    # OOM 으로 죽는데, 그때 "왜 죽었는지" 가 안 남는다. 상한이 있어야 원인이 분명해진다.
    container_name: lts-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      # k6 가 --out experimental-prometheus-rw 로 지표를 밀어 넣을 수 있게 한다.
      # 앱 지표와 부하 지표가 같은 타임라인에 올라와야 원인 규명이 된다.
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    cpus: 0.5
    mem_limit: 2g

  grafana:
    image: grafana/grafana:11.5.1
    container_name: lts-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    cpus: 0.3
    mem_limit: 512m

  # 기본 기동에 포함하지 않는다. `docker compose run --rm k6 run /scripts/<파일>` 로 실행.
  k6:
    image: grafana/k6:0.56.0
    # container_name 을 두지 않는다. `docker compose run` 은 자체 이름
    # (loadtest-sim-k6-run-<해시>)으로 컨테이너를 띄우므로 고정 이름과 충돌한다.
    profiles: ["load"]
    environment:
      BASE_URL: http://app:3000
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(90),p(95),p(99),max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: "5s"
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    cpus: 1.5
    mem_limit: 2g

volumes:
  pgdata:
  promdata:
