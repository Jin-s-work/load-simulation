global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 앱은 1초 해상도로 긁는다. 계단이 60초씩이라 5초 해상도로는 계단 안의 변화를 놓친다.
  - job_name: app
    scrape_interval: 1s
    scrape_timeout: 900ms
    static_configs:
      - targets: ["app:3000"]

  - job_name: postgres
    scrape_interval: 2s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
